# The sources that test/pkg compiles to Wasm and runs natively: each repository at a pinned
# commit, plus patches applied one by one, in file order. `julia test/pkg/apply_patches.jl`
# checks them out (into test/pkg/work/ by default) and applies the patches, committing each.
#
# A patch is the diff `from..to` of `repo`, restricted to `paths` (all files if absent),
# applied with `git apply -3`. Both commits are fetched by sha, so the applied content is
# exactly the pinned one even after the branch moves; `--check-heads` reports the patches
# whose PR or branch has moved, and `--refresh` rewrites the pins (`to` = the current head,
# `from` = its merge base with `merge_base_with`).
#
# Pkg: release-1.13, the Pkg of Julia 1.13.2 plus backports. WasmCodegen supports Julia 1.12
# and 1.13 only, and Pkg's master needs Julia 1.15, so the Wasm build and the native runs use
# release-1.13. A master PR is applied as its `src/` diff; where that doesn't apply to
# release-1.13, its backport branch (`bp13/<branch>`, one commit on top of the patches before
# it: `from_parent`) is applied instead.

[Pkg]
repo = "https://github.com/JuliaLang/Pkg.jl"
branch = "release-1.13"
sha = "18efae02bf07d95ec21ac25d72a9f8b2af051ac8"

[[Pkg.patch]]
name = "JuliaLang/Pkg.jl#4894 trim-semver-spec"
pr = "JuliaLang/Pkg.jl#4894"
repo = "https://github.com/pankgeorg/Pkg.jl"
merge_base_with = "https://github.com/JuliaLang/Pkg.jl master"
from = "7eabf057dde682ab61818030d3b0b2d61ab7053b"
to = "dd2e4c3ec449ee1a4fa35d2bdfbe8d5e444acae2"
paths = ["src"]

