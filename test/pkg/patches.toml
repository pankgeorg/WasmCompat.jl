sha = "0034569817c5ddf1b7d1836df38f1b3d6bb00460"

# WasmBuilder and IRStructurizer: as WasmCodegen's Project.toml [sources] names them. Where it
# names a branch (WasmBuilder: main), `sha` pins the commit (--check-heads reports a newer one).
[WasmBuilder]
from_sources_of = "WasmCodegen"
# main with gbaraldi/WasmBuilder.jl#2 (structural function types; needed to link the pcre2 and
# libgit2 import modules)
